---
- name: Verify self-built Cinny
  hosts: all
  become: true
  gather_facts: false

  vars:
    cinny_molecule_base_url: "http://127.0.0.1:{{ cinny_molecule_http_bind_port }}"
    cinny_molecule_bundle_path: /tmp/cinny-molecule-bundle.js

  tasks:
    - name: Run the shared Cinny verification
      ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"
